plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zufe.liveview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zufe.liveview'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.2.2'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'liveview'
            keyAlias 'liveview'
            keyPassword 'liveview'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
