name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取头部 @version 与代码里的 VERSION
        id: ver
        run: |
          set -e
          header=$(grep -m1 -E '^// @version' zufe-live-restore.user.js | awk '{print $NF}' | tr -d '\r')
          codever=$(grep -oE "const VERSION = '[0-9][0-9A-Za-z.-]*'" zufe-live-restore.user.js | head -1 | sed -E "s/.*'([^']+)'.*/\1/" | tr -d '\r')
          echo "header=$header" >> "$GITHUB_OUTPUT"
          echo "const=$codever" >> "$GITHUB_OUTPUT"
          echo "tag=v$header" >> "$GITHUB_OUTPUT"
          echo "header=$header const=$codever"

      - name: 校验两处版本号一致
        run: |
          if [ -z "${{ steps.ver.outputs.header }}" ]; then echo "::error::没读到头部 @version"; exit 1; fi
          if [ -z "${{ steps.ver.outputs.const }}" ]; then echo "::error::代码里没找到 const VERSION"; exit 1; fi
          if [ "${{ steps.ver.outputs.header }}" != "${{ steps.ver.outputs.const }}" ]; then
            echo "::error::头部 @version=${{ steps.ver.outputs.header }} 与 VERSION=${{ steps.ver.outputs.const }} 不一致"
            exit 1
          fi

      - name: 打 tag 并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ steps.ver.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "tag $tag 已存在，本次不重复发布"
            exit 0
          fi
          gh release create "$tag" zufe-live-restore.user.js \
            --title "$tag" \
            --notes "自动发布 $tag。安装/更新链接：https://raw.githubusercontent.com/${{ github.repository }}/main/zufe-live-restore.user.js" \
            --target "${{ github.sha }}"
